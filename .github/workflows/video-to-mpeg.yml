name: Video to MPEG

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp

      - name: Ensure npm project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install dependencies
        run: |
          npm install --no-fund --no-audit webtorrent@1

      - name: Create directories
        run: |
          mkdir -p output
          mkdir -p input

      - name: Show FFmpeg version
        run: ffmpeg -version

      - name: Run downloader
        run: node download.js

      - name: List output files
        run: ls -lah output

      - name: Upload MPEG files
        uses: actions/upload-artifact@v4
        with:
          name: mpeg-output
          path: output/*.mpeg
          if-no-files-found: warn
