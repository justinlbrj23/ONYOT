name: YouTube to MPEG (Stable)

on:
  push:
    paths:
      - "urls.txt"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: "v2.x"

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python3 -m pip install -U pip
          python3 -m pip install -U "yt-dlp[default]"
          python3 -m pip install -U yt-dlp-ejs

          yt-dlp --version
          deno --version
          ffmpeg -version

      - name: Setup cookies (from secret, optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "cookies.txt written from secret"
          else
            echo "YT_COOKIES secret not set; continuing without cookies"
            rm -f cookies.txt
          fi

      - name: Download ALL URLs from urls.txt (batch)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p downloads output

          echo "===== urls.txt (numbered) ====="
          nl -ba urls.txt || true
          echo "===== URL count ====="
          wc -l urls.txt || true
          echo "==============================="

          COOKIES_OPT=""
          if [ -f cookies.txt ]; then
            COOKIES_OPT="--cookies cookies.txt"
          fi

          # Batch file mode: -a/--batch-file reads one URL per line from urls.txt
          # Continue on failures: -i/--ignore-errors and --no-abort-on-error
          # Force IPv4: -4/--force-ipv4
          # Enable Deno + EJS remote components: --js-runtimes deno and --remote-components ejs:github
          # Retry options are supported by yt-dlp as well
          yt-dlp \
            -a urls.txt \
            --no-playlist \
            --no-abort-on-error \
            -i \
            $COOKIES_OPT \
            --js-runtimes deno \
            --remote-components ejs:github \
            -4 \
            --socket-timeout 30 \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep exp=1:60 \
            -N 1 \
            -f "bv*[ext=mp4][vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/b" \
            -o "downloads/%(id)s.%(ext)s"

          echo "===== Downloaded files ====="
          ls -lh downloads || true

      - name: Convert ALL downloads to PAL-VCD (single file per video)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output
          shopt -s nullglob

          echo "===== Converting downloads -> output ====="
          for f in downloads/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            id="${base%%.*}"

            echo "Converting $f -> output/$id.mpg"

            # -target pal-vcd produces PAL VCD MPEG-1 output (single file)
            ffmpeg -y -i "$f" -target pal-vcd "output/$id.mpg" || true
          done

          echo "===== Output files ====="
          ls -lh output || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vcd-mpg-videos
          path: output/*.mpg
          if-no-files-found: warn
