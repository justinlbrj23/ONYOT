name: YouTube to MPEG (Stable)

on:
  push:
    paths:
      - 'urls.txt'

  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install ffmpeg -y
          python3 -m pip install -U yt-dlp

      - name: Run converter
        run: |
          mkdir -p output

          while read url; do
            echo "Processing $url"

            yt-dlp \
              --cookies cookies.txt \
              -f "bv*+ba/b" \
              -o - "$url" | \
            ffmpeg -i - \
              -c:v mpeg2video \
              -qscale:v 2 \
              -c:a mp2 \
              -b:a 192k \
              "output/%(id)s.mpeg"

          done < urls.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: mpeg-videos
          path: output/*.mpeg
