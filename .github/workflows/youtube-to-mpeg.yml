name: YouTube to MPEG (Stable)

on:
  push:
    paths:
      - "urls.txt"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: "v2.x"

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python3 -m pip install -U pip
          python3 -m pip install -U "yt-dlp[default]"
          python3 -m pip install -U yt-dlp-ejs

          yt-dlp --version
          deno --version
          ffmpeg -version

      - name: Setup cookies (from secret, optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "cookies.txt written from secret"
          else
            echo "YT_COOKIES secret not set; continuing without cookies"
            rm -f cookies.txt
          fi

      - name: Run converter (PAL-VCD MPEG-1, split into parts)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          # ~9 minutes per part (adjust to 480 for 8 min if you still exceed 100MiB)
          SEGMENT_SECONDS=540

          while IFS= read -r url || [ -n "$url" ]; do
            url="$(echo "$url" | sed 's/\r$//')"
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac

            echo "Processing: $url"

            tmpdir="$(mktemp -d)"
            outtmpl="$tmpdir/%(id)s.%(ext)s"

            # If cookies exist, use them; otherwise run as guest
            COOKIES_OPT=""
            if [ -f cookies.txt ]; then
              COOKIES_OPT="--cookies cookies.txt"
            fi

            # yt-dlp download with stronger network resilience + force IPv4
            # -4 / --force-ipv4 is supported by yt-dlp
            # --socket-timeout / --retries / --fragment-retries / --retry-sleep are supported by yt-dlp
            if ! yt-dlp \
              --no-playlist \
              $COOKIES_OPT \
              --js-runtimes deno \
              --remote-components ejs:github \
              -4 \
              --socket-timeout 30 \
              --retries infinite \
              --fragment-retries infinite \
              --retry-sleep exp=1:60 \
              -N 1 \
              -f "bv*[ext=mp4][vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/b" \
              -o "$outtmpl" \
              "$url"; then
              echo "❌ Download failed for: $url"
              rm -rf "$tmpdir"
              echo "Continuing to next URL..."
              continue
            fi

            # Convert to PAL VCD MPEG-1 and split into parts
            shopt -s nullglob
            for f in "$tmpdir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              id="${base%%.*}"

              echo "Encoding PAL-VCD + splitting: $f -> output/${id}_part###.mpg"

              ffmpeg -y -i "$f" \
                -target pal-vcd \
                -f segment -segment_time "$SEGMENT_SECONDS" -reset_timestamps 1 \
                "output/${id}_part%03d.mpg" || true
            done
            shopt -u nullglob

            rm -rf "$tmpdir"
          done < urls.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vcd-mpg-videos
          path: output/*.mpg
          if-no-files-found: warn
