name: YouTube to MPEG (Stable)

on:
  push:
    paths:
      - "urls.txt"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Deno is the recommended JS runtime for solving YouTube JS challenges
      - name: Setup Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: "v2.x"

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python3 -m pip install -U pip
          python3 -m pip install -U "yt-dlp[default]"
          python3 -m pip install -U yt-dlp-ejs

          yt-dlp --version
          deno --version
          ffmpeg -version

      - name: Setup cookies (from secret)
        shell: bash
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "cookies.txt written from secret"
          else
            echo "YT_COOKIES secret not set; continuing without cookies"
            : > cookies.txt
          fi

      - name: Run converter
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output

          while IFS= read -r url || [ -n "$url" ]; do
            url="$(echo "$url" | sed 's/\r$//')"
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac

            echo "Processing: $url"

            tmpdir="$(mktemp -d)"
            outtmpl="$tmpdir/%(id)s.%(ext)s"

            # Download first (no pipe). Use Deno + EJS remote components (supported source)
            if ! yt-dlp \
              --no-playlist \
              --cookies cookies.txt \
              --js-runtimes deno \
              --remote-components ejs:github \
              -f "bv*[ext=mp4][vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/b" \
              -o "$outtmpl" \
              "$url"; then
              echo "❌ Download failed for: $url"
              rm -rf "$tmpdir"
              echo "Continuing to next URL..."
              continue
            fi

            shopt -s nullglob
            for f in "$tmpdir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              id="${base%%.*}"
              echo "Converting $f -> output/$id.mpeg"

              ffmpeg -y -i "$f" \
                -c:v mpeg2video -qscale:v 2 \
                -c:a mp2 -b:a 192k \
                "output/$id.mpeg" || true
            done
            shopt -u nullglob

            rm -rf "$tmpdir"
          done < urls.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: mpeg-videos
          path: output/*.mpeg
          if-no-files-found: warn
