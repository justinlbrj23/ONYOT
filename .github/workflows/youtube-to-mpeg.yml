name: Download YouTube to MPEG

on:
  push:
    paths:
      - 'urls.txt'

  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install ffmpeg -y

      - name: Install yt-dlp
        run: |
          python3 -m pip install -U yt-dlp

      - name: Run downloader
        run: node download.js

      - name: Upload MPEG files
        uses: actions/upload-artifact@v4
        with:
          name: mpeg-files
          path: output/*.mpeg
