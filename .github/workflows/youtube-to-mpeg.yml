name: YouTube to MPEG (Stable)

on:
  push:
    paths:
      - "urls.txt"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: "v2.x"

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python3 -m pip install -U pip
          python3 -m pip install -U "yt-dlp[default]"
          python3 -m pip install -U yt-dlp-ejs

          yt-dlp --version
          deno --version
          ffmpeg -version

      - name: Setup cookies (from secret, optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "cookies.txt written from secret"
          else
            echo "YT_COOKIES secret not set; continuing without cookies"
            rm -f cookies.txt
          fi

      - name: Run converter (PAL-VCD MPEG-1, single file)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          while IFS= read -r url || [ -n "$url" ]; do
            url="$(echo "$url" | sed 's/\r$//')"
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac

            echo "Processing: $url"

            tmpdir="$(mktemp -d)"
            outtmpl="$tmpdir/%(id)s.%(ext)s"

            # Download first (no pipe). Force IPv4 + retries/backoff for transient network issues
            # Supported by yt-dlp: -4/--force-ipv4, --socket-timeout, --retries, --fragment-retries, --retry-sleep,
            # --js-runtimes, --remote-components ejs:github [1](https://github.com/yt-dlp/yt-dlp/issues/14404)
            if [ -f cookies.txt ]; then
              yt_dlp_cmd=(yt-dlp
                --no-playlist
                --cookies cookies.txt
                --js-runtimes deno
                --remote-components ejs:github
                -4
                --socket-timeout 30
                --retries infinite
                --fragment-retries infinite
                --retry-sleep exp=1:60
                -N 1
                -f "bv*[ext=mp4][vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/b"
                -o "$outtmpl"
                "$url"
              )
            else
              yt_dlp_cmd=(yt-dlp
                --no-playlist
                --js-runtimes deno
                --remote-components ejs:github
                -4
                --socket-timeout 30
                --retries infinite
                --fragment-retries infinite
                --retry-sleep exp=1:60
                -N 1
                -f "bv*[ext=mp4][vcodec^=avc1]+ba[ext=m4a]/b[ext=mp4]/b"
                -o "$outtmpl"
                "$url"
              )
            fi

            if ! "${yt_dlp_cmd[@]}"; then
              echo "❌ Download failed for: $url"
              rm -rf "$tmpdir"
              echo "Continuing to next URL..."
              continue
            fi

            # Convert to PAL VCD MPEG-1 (single output per video)
            # pal-vcd corresponds to PAL VCD target settings (352x288 @ 25fps, mpeg1video + mp2) [2](https://raw.githubusercontent.com/actions/upload-artifact/main/README.md)[3](https://github.com/ivanopcode/yt-dlp-best)
            shopt -s nullglob
            for f in "$tmpdir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              id="${base%%.*}"

              echo "Encoding PAL-VCD: $f -> output/$id.mpg"
              ffmpeg -y -i "$f" -target pal-vcd "output/$id.mpg" || true
            done
            shopt -u nullglob

            rm -rf "$tmpdir"
          done < urls.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vcd-mpg-videos
          path: output/*.mpg
          if-no-files-found: warn
